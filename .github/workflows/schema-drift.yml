name: Schema Drift Gate

permissions:
  contents: read

concurrency:
  group: schema-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
  pull_request:
    branches: [main, develop]
  # Allow manual trigger for production pre-deploy checks
  workflow_dispatch:

jobs:
  schema-drift:
    name: Detect schema drift
    runs-on: ubuntu-24.04            # ubuntu-latest resolves to 24.04 in 2026
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine    # PostgreSQL 17 — latest stable 2026
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://app:secret@localhost:5432/test_db
      PYTHONPATH: ./fastapi
      DRIFT_LOG_FILE: logs/drift_gate_ci.log

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python ───────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ── Dependencies ─────────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r fastapi/requirements.txt
          python -m pip install "pytest>=8.3" "pytest-alembic>=0.11" "psycopg[binary]>=3.2"

      # ── PostgreSQL setup ─────────────────────────────────────────────────
      - name: Install pgcrypto extension
        run: |
          PGPASSWORD=secret psql \
            -h localhost -U app -d test_db \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      - name: Run full schema drift gate
        run: |
          set +e
          mkdir -p logs
          LOG_FILE="${DRIFT_LOG_FILE}"

          echo "Schema drift CI run started at $(date -u +%Y-%m-%dT%H:%M:%SZ)" > "$LOG_FILE"

          echo "== GATE 1: alembic upgrade head ==" >> "$LOG_FILE"
          alembic -c alembic.ini upgrade head >> "$LOG_FILE" 2>&1
          G1=$?

          echo "== GATE 2: drift_check.py ==" >> "$LOG_FILE"
          python db/scripts/drift_check.py >> "$LOG_FILE" 2>&1
          G2=$?

          echo "== GATE 3: pytest schema drift ==" >> "$LOG_FILE"
          pytest db/test/test_schema_drift.py -q --maxfail=1 --disable-warnings --tb=short --test-alembic >> "$LOG_FILE" 2>&1
          G3=$?

          echo "== GATE 4: pending autogenerate check ==" >> "$LOG_FILE"
          alembic -c alembic.ini revision --autogenerate -m verify_no_pending_ci_gate --rev-id pending_check_tmp >> "$LOG_FILE" 2>&1
          G4=$?

          PENDING_FILE="db/alembic/versions/pending_check_tmp_verify_no_pending_ci_gate.py"
          if [ -f "$PENDING_FILE" ] && grep -qE "op\.(create|drop|add|alter)" "$PENDING_FILE"; then
            echo "❌ Pending schema operations detected in autogenerated migration." >> "$LOG_FILE"
            grep -E "op\.(create|drop|add|alter)" "$PENDING_FILE" >> "$LOG_FILE"
            G4=1
          fi

          RESULT="RESULT migration=$G1 drift_script=$G2 pytest_drift=$G3 pending_autogen=$G4"
          echo "$RESULT" | tee -a "$LOG_FILE"

          if [ "$G1" -ne 0 ] || [ "$G2" -ne 0 ] || [ "$G3" -ne 0 ] || [ "$G4" -ne 0 ]; then
            exit 1
          fi

      - name: Upload schema drift logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-logs-${{ github.run_id }}
          path: |
            logs/drift_gate_ci.log
            db/alembic/versions/pending_check_tmp_verify_no_pending_ci_gate.py
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up CI checkpoint revision
        if: always()
        run: |
          rm -f db/alembic/versions/pending_check_tmp_verify_no_pending_ci_gate.py

  schema-drift-dump-compat:
    name: Detect schema drift (dump-compat)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: recipe_user
          POSTGRES_PASSWORD: recipe_pass123
          POSTGRES_DB: recipe_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://recipe_user:recipe_pass123@localhost:5432/recipe_db
      PYTHONPATH: ./fastapi
      DRIFT_LOG_FILE: logs/drift_gate_dump_compat_ci.log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r fastapi/requirements.txt
          python -m pip install "pytest>=8.3" "pytest-alembic>=0.11" "psycopg[binary]>=3.2"

      - name: Bootstrap dump-init schema
        run: |
          PGPASSWORD=recipe_pass123 psql \
            -h localhost -U recipe_user -d recipe_db \
            -v ON_ERROR_STOP=1 \
            -f db/init/01_dump.sql

          PGPASSWORD=recipe_pass123 psql \
            -h localhost -U recipe_user -d recipe_db \
            -v ON_ERROR_STOP=1 \
            -f db/init/02_align_alembic_revision.sql

      - name: Run dump-compat schema drift gate
        run: |
          mkdir -p logs
          chmod +x db/scripts/run_local_drift_gate.sh
          DRIFT_LOG_FILE="$DRIFT_LOG_FILE" \
          PENDING_REV_ID="pending_check_tmp_dump_compat" \
          PENDING_MSG="verify_no_pending_dump_compat_gate" \
          ./db/scripts/run_local_drift_gate.sh

      - name: Upload dump-compat drift logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-dump-compat-logs-${{ github.run_id }}
          path: |
            logs/drift_gate_dump_compat_ci.log
            db/alembic/versions/pending_check_tmp_dump_compat_verify_no_pending_dump_compat_gate.py
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up dump-compat checkpoint revision
        if: always()
        run: |
          rm -f db/alembic/versions/pending_check_tmp_dump_compat_verify_no_pending_dump_compat_gate.py
