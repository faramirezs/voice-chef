name: Schema Drift Gate

permissions:
  contents: read

concurrency:
  group: schema-drift-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  schema-drift:
    name: Detect schema drift
    runs-on: ubuntu-24.04            # ubuntu-latest resolves to 24.04 in 2026
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg2://app:secret@localhost:5432/test_db
      PYTHONPATH: ./fastapi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r fastapi/requirements.txt
          python -m pip install "pytest>=8.3" "pytest-alembic>=0.11" "psycopg2-binary>=2.9"

      - name: Install pgcrypto extension
        run: |
          PGPASSWORD=secret psql \
            -h localhost -U app -d test_db \
            -c "CREATE EXTENSION IF NOT EXISTS pgcrypto;"

      # ── Gate 0: Migration chain ──────────────────────────────────────────
      - name: Apply all migrations to head
        working-directory: db
        run: alembic upgrade head

      # ── Gate 1: Programmatic drift check ────────────────────────────────
      - name: Assert no schema drift (compare_metadata)
        run: python db/scripts/drift_check.py

      # ── Gate 2: pytest-alembic full suite ───────────────────────────────
      - name: Run schema drift test suite
        working-directory: db
        run: |
          pytest db/test/test_schema_drift.py \
            -v \
            --tb=short \
            --test-alembic
            --test-alembic

      # ── Gate 3: Single migration head ───────────────────────────────────
      - name: Assert single migration head (no branch divergence)
        working-directory: db
        run: |
          HEAD_COUNT=$(alembic heads | grep -c "(head)")
          if [ "$HEAD_COUNT" -ne 1 ]; then
            echo "❌ Multiple migration heads detected: $HEAD_COUNT"
            echo "Run: alembic merge heads -m 'merge'"
            exit 1
          fi
          echo "✅ Single migration head confirmed."

      # ── Gate 4: No pending (uncommitted) model changes ──────────────────
      - name: Assert no pending migrations (models fully committed)
        working-directory: db
        run: |
          alembic revision --autogenerate -m "ci_check"
          # If the generated file contains only 'pass', models are in sync.
          LATEST_FILE=$(ls -t db/alembic/versions/*ci_check*.py | head -1)
          if grep -qE "op\.(create|drop|add|alter)" "$LATEST_FILE"; then
            echo "❌ Pending schema changes found in models not yet in a migration:"
            grep -E "op\.(create|drop|add|alter)" "$LATEST_FILE"
            exit 1
          fi
          echo "✅ No pending migrations — models are fully committed."

      - name: Upload pending migration artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-ci-check-${{ github.run_id }}
          path: db/alembic/versions/*ci_check*.py
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean up CI checkpoint revision
        if: always()
        run: |
          rm -f db/alembic/versions/*ci_check*.py
