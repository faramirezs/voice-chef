name: Deploy to Hetzner VPS

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false  # never cancel an in-progress deploy.

on:
  workflow_run:
    workflows: ["Schema Drift Gate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "Deploy mode"
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - dev

jobs:
  deploy:
    name: Deploy (${{ github.event.inputs.mode || 'prod' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check schema-drift result
        if: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' }}
        run: |
          echo "Schema drift gate failed — aborting deploy"
          exit 1

      - name: Set deploy mode
        id: mode
        run: echo "mode=${{ github.event.inputs.mode || 'prod' }}" >> $GITHUB_OUTPUT
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}

      - name: Add VPS to known hosts
        run: |
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts
      - name: Check VPS disk space (auto-clean if needed)
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} "
            echo '=== Disk usage ===' && df -h / &&
            echo '=== Docker disk usage ===' && docker system df &&
            FREE_GB=\$(df -BG / | tail -1 | awk '{print \$4}' | sed 's/G//') &&
            echo \"Free: \${FREE_GB}GB\" &&
            if [ \"\$FREE_GB\" -lt 5 ]; then
              echo 'Low disk — running docker system prune -a -f...' &&
              docker system prune -a -f &&
              echo '=== After cleanup ===' &&
              df -h / &&
              FREE_GB=\$(df -BG / | tail -1 | awk '{print \$4}' | sed 's/G//') &&
              echo \"Free after cleanup: \${FREE_GB}GB\" &&
              if [ \"\$FREE_GB\" -lt 5 ]; then
                echo \"ERROR: Still less than 5GB free after cleanup (\${FREE_GB}GB) — aborting deploy\" &&
                exit 1
              fi
            fi"

      - name: Fix VPS git permissions (if needed)
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "cd ${{ secrets.HETZNER_DEPLOY_PATH }} && \
             if ! touch .git/objects/.write-test 2>/dev/null; then \
               echo 'Permissions broken on .git/objects — attempting fix...'; \
               sudo chown -R \$(whoami):\$(whoami) .git || echo 'sudo failed — fix manually on VPS: sudo chown -R \$USER:\$USER .git'; \
             else \
               rm -f .git/objects/.write-test; \
             fi"
      - name: Pull latest code on VPS
        run: |
          DEPLOY_BRANCH="${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}"
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "cd ${{ secrets.HETZNER_DEPLOY_PATH }} && git fetch origin && git checkout -B $DEPLOY_BRANCH origin/$DEPLOY_BRANCH"

      - name: Build and restart services (${{ steps.mode.outputs.mode }} mode)
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "cd ${{ secrets.HETZNER_DEPLOY_PATH }} && make ${{ steps.mode.outputs.mode }}"
        timeout-minutes: 25

      - name: Run Alembic migrations
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "cd ${{ secrets.HETZNER_DEPLOY_PATH }} && \
             docker compose exec -T backend alembic -c alembic.ini upgrade head"

      - name: Verify services are healthy
        run: |
          ssh ${{ secrets.HETZNER_USER }}@${{ secrets.HETZNER_HOST }} \
            "cd ${{ secrets.HETZNER_DEPLOY_PATH }} && make status"
