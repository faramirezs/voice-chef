name: Build Check

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-kitchen:
    name: Build Kitchen Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/kitchen/package-lock.json

      - name: Install dependencies
        run: cd frontend/kitchen && npm ci

      - name: Build
        run: cd frontend/kitchen && npm run build

  build-office:
    name: Build Office Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/office/package-lock.json

      - name: Install dependencies
        run: cd frontend/office && npm ci

      - name: Build
        run: cd frontend/office && npm run build

  build-backend:
    name: Build Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel packaging
          python -m pip install -r backend/requirements.txt

      - name: Check Python syntax
        run: |
          python -m py_compile $(find backend -name "*.py")

      - name: Verify backend imports
        env:
          DATABASE_URL: postgresql+psycopg://dummy:dummy@localhost:5432/dummy
          SECRET_KEY: dummy-secret-key-for-ci-only
          INTERNAL_SECRET: dummy-internal-secret
        run: |
          cd backend && python -c "from app.main import app; print('Backend imports OK')"
