services:
  frontend:
    build:
      context: ./frontend/
    ports:
      - "8080:80"
    networks:
      - app-network
    # args:
    #     VITE_API_URL: ${VITE_API_URL}
    depends_on:
      - fastapi
  # api:
  #   build:
  #     context: ./api
  #   networks:
  #     - app-network
  db:
    image: postgres:17.8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro  # auto-runs on first start
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
       - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    container_name: fastapi
    # image: fastapi
    build: fastapi/
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      - ./db/alembic:/code/db/alembic:ro
      - ./alembic.ini:/code/alembic.ini:ro
    command: >
      sh -c "alembic -c /code/alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 80 --reload"
    networks:
      - app-network
    ports:
      - "8000:80"
    restart: always

volumes:
  postgres_data:

networks:
  app-network:
