services:
  nginx-proxy:
    build: ./nginx-proxy/
    ports:
      - "8080:80"
      - "4444:4444"
    depends_on:
      - office-frontend
      - kitchen-frontend
      - backend
      - agent
      - stt
    networks:
      - app-network
    volumes:
      - nginx_ssl:/etc/nginx/ssl
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}

  office-frontend:
    build:
      context: ./frontend/office/
      target: runtime
      args:
        - VITE_KITCHEN_URL=${VITE_KITCHEN_URL:-/kitchen/}
    networks:
      - app-network
    depends_on:
      - backend

  kitchen-frontend:
    build:
      context: ./frontend/kitchen/
      target: runtime
    networks:
      - app-network
    depends_on:
      - agent

  db:
    image: postgres:17.8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro  # auto-runs on first start
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SQL_ECHO: ${SQL_ECHO}
      SECRET_KEY: ${SECRET_KEY}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    volumes:
      - backend_data:/code/data


  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - app-network
    environment:
      FASTAPI_INTERNAL_URL: http://backend:80
      AGENT_PROVIDER: ${AGENT_PROVIDER:-nvidia}
      AGENT_BASE_URL: ${AGENT_BASE_URL}
      AGENT_API_KEY: ${AGENT_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-ai/deepseek-v4-flash}
      AGENT_DEBUG_STREAM: ${AGENT_DEBUG_STREAM}
      INTERNAL_SECRET: ${INTERNAL_SECRET}

  stt:
    build:
      context: ./stt
      dockerfile: Dockerfile
    networks:
      - app-network
    environment:
      STT_MODEL: ${STT_MODEL:-base}
      STT_LANGUAGE: ${STT_LANGUAGE:-}
      STT_DEVICE: ${STT_DEVICE:-cpu}
    volumes:
      - whisper_models:/models

volumes:
  whisper_models:
  postgres_data:
  backend_data:
  nginx_ssl:

networks:
  app-network:
