services:
  nginx-proxy:
    build: ./nginx-proxy/
    ports:
      - "8080:80"
      - "4444:4444"
    depends_on:
      - office-frontend
      - kitchen-frontend
      - backend
      - agent
      - stt
    networks:
      - app-network
    volumes:
      - nginx_ssl:/etc/nginx/ssl
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}

  office-frontend:
    build:
      context: ./frontend/office/
      target: runtime
      args:
        - VITE_KITCHEN_URL=${VITE_KITCHEN_URL:-/kitchen/}
    networks:
      - app-network
    depends_on:
      - backend

  kitchen-frontend:
    build:
      context: ./frontend/kitchen/
      target: runtime
    networks:
      - app-network
    depends_on:
      - agent

  db:
    image: postgres:17.8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro  # auto-runs on first start
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SQL_ECHO: ${SQL_ECHO}
      SECRET_KEY: ${SECRET_KEY}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    volumes:
      - backend_data:/code/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:80/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s


  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    environment:
      FASTAPI_INTERNAL_URL: http://backend:80
      RAG_SERVICE_URL: http://rag:8003
      SEARCH_ABSOLUTE_FLOOR: ${SEARCH_ABSOLUTE_FLOOR:-0.20}
      SEARCH_RELATIVE_FACTOR: ${SEARCH_RELATIVE_FACTOR:-0.55}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-nvidia}
      AGENT_BASE_URL: ${AGENT_BASE_URL}
      AGENT_API_KEY: ${AGENT_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-ai/deepseek-v4-flash}
      AGENT_DEBUG_STREAM: ${AGENT_DEBUG_STREAM}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  stt:
    build:
      context: ./stt
      dockerfile: Dockerfile
    networks:
      - app-network
    environment:
      STT_MODEL: ${STT_MODEL:-base}
      STT_LANGUAGE: ${STT_LANGUAGE:-}
      STT_DEVICE: ${STT_DEVICE:-cpu}
    volumes:
      - whisper_models:/models
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  qdrant:
    image: qdrant/qdrant:v1.14.1
    networks:
      - app-network
    environment:
      # Qdrant uses double-underscore for nested config keys. Setting this
      # requires every client to send `api-key: <value>` — closes lateral
      # access from anything else on app-network.
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY}
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rag:
    build:
      context: ./rag
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - app-network
    environment:
      BACKEND_URL: http://backend:80
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-paraphrase-multilingual-mpnet-base-v2}
      EMBEDDING_POLL_SECONDS: ${EMBEDDING_POLL_SECONDS:-30}
      # Shared internal-service secret — backend's `_is_internal_request`
      # recognises this header and bypasses user-auth for service-to-service
      # calls (rag indexing /api/recipes, /api/ingredient at startup).
      # Same pattern as the agent service. Without this, rag startup fails
      # with 401 on /api/recipes.
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    volumes:
      - embedding_models:/root/.cache/huggingface
    # Cap rag at 2 CPUs. Sentence-transformers + BM25 inference is
    # CPU-bound and PyTorch's BLAS pool can otherwise saturate the
    # Docker VM during back-to-back searches, triggering thermal
    # throttling on the host.
    cpus: 2.0
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health').read()\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  whisper_models:
  postgres_data:
