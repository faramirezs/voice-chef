services:
  frontend:
    build:
      context: ./frontend/
    ports:
      - "8080:80"
    networks:
      - app-network
    depends_on:
      - fastapi

  db:
    image: postgres:17.8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro  # auto-runs on first start
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
       - "5432:5432"
    networks: 
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  fastapi:
    container_name: fastapi
    # image: fastapi
    build: fastapi/
    depends_on:
      db:
        condition: service_healthy
    networks: 
      - app-network
    ports:
      - "80"
    restart: always
    environment:
      DATABASE_URL: ${DATABASE_URL}

volumes:
  postgres_data:

networks:
  app-network:
