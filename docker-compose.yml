services:
  office-frontend:
    build:
      context: ./frontend/office/
      target: runtime
      args:
        - VITE_KITCHEN_URL=${VITE_KITCHEN_URL:-http://localhost:8082}
    ports:
      - "8080:80"
    networks:
      - app-network
    depends_on:
      - backend

  kitchen-frontend:
    build:
      context: ./frontend/kitchen/
      target: runtime
    ports:
      - "8082:80"
    environment:
      # Where the kitchen SPA sends unauthenticated users for login.
      # Default points at the office-frontend on the same host (dev).
      OFFICE_URL: ${OFFICE_URL:-http://localhost:8080}
    networks:
      - app-network
    depends_on:
      - agent

  db:
    image: postgres:17.8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro  # auto-runs on first start
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
       - "5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "8000:80"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SQL_ECHO: ${SQL_ECHO}
      SECRET_KEY: ${SECRET_KEY}
      DEFAULT_TENANT_ID: ${DEFAULT_TENANT_ID}
      INTERNAL_SECRET: ${INTERNAL_SECRET}
    volumes:
      # - ./backend/uploads:/code/uploads
      - uploads:/code/uploads

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - app-network
    ports:
      - "8001:8001"
    environment:
      FASTAPI_INTERNAL_URL: http://backend:80
      AGENT_PROVIDER: ${AGENT_PROVIDER:-nvidia}
      AGENT_BASE_URL: ${AGENT_BASE_URL}
      AGENT_API_KEY: ${AGENT_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-ai/deepseek-v4-flash}
      AGENT_DEBUG_STREAM: ${AGENT_DEBUG_STREAM}
      INTERNAL_SECRET: ${INTERNAL_SECRET}

  stt:
    build:
      context: ./stt
      dockerfile: Dockerfile
    networks:
      - app-network
    ports:
      - "8002:8002"
    environment:
      STT_MODEL: ${STT_MODEL:-base}
      STT_LANGUAGE: ${STT_LANGUAGE:-}
      STT_DEVICE: ${STT_DEVICE:-cpu}
    volumes:
      - whisper_models:/models

volumes:
  whisper_models:
  postgres_data:
  uploads:

networks:
  app-network:
