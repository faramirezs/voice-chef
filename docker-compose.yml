services:
  db:
    image: postgres:17.8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro  # auto-runs on first start
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
       - "5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    ports:
      - "80"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SQL_ECHO: ${SQL_ECHO}

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - app-network
    ports:
      - "8001:8001"
    environment:
      FASTAPI_INTERNAL_URL: http://backend:80
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL}

  frontend:
    build:
      context: ./frontend/
    ports:
      - "8080:80"
    networks:
      - app-network
    depends_on:
      - backend

volumes:
  postgres_data:

networks:
  app-network:
