services:
  kitchen-frontend:
    image: voice-chef-kitchen-frontend:latest
    build:
      context: ../frontend/kitchen/
    ports:
      - "80:80"
    environment:
      # Point the kitchen-frontend's nginx proxy at the server (via Tailscale).
      # The defaults baked into docker-entrypoint.sh would point at the local
      # docker-network names (backend / agent), which only work on the server's
      # compose stack. On the Pi, both backend and agent live on the server.
      #
      # We target backend (8000) and agent (8001) directly on the server's
      # published ports rather than going through the server's own kitchen-frontend
      # nginx (8082) — one less hop, and avoids coupling to the server's host
      # port choice.
      BACKEND_HOST: ${SERVER_HOST}
      BACKEND_PORT: ${SERVER_BACKEND_PORT:-8000}
      AGENT_HOST: ${SERVER_HOST}
      AGENT_PORT: ${SERVER_AGENT_PORT:-8001}
      # Where unauthenticated kitchen users get redirected to log in.
      # Points at the server's office-frontend over Tailscale.
      OFFICE_URL: http://${SERVER_HOST}:${SERVER_OFFICE_PORT:-8080}
      # Kitchen-device auto-login: the SPA POSTs these creds to /api/auth/login
      # on initial load if /api/auth/me returns 401, so the device authenticates
      # as a "kitchen"-role user without human interaction. Set in pi/.env.
      KITCHEN_EMAIL: ${KITCHEN_EMAIL}
      KITCHEN_PASSWORD: ${KITCHEN_PASSWORD}
    extra_hosts:
      # Tailscale MagicDNS names aren't visible inside Docker bridge networks.
      # Pin the server's Tailscale IP into /etc/hosts so nginx upstream resolution
      # works. Tailscale per-device IPs are stable, so this rarely needs editing.
      - "${SERVER_HOST}:${SERVER_TAILSCALE_IP}"
    depends_on:
      - stt
    restart: unless-stopped

  stt:
    image: voice-chef-stt:latest
    build:
      context: ../stt/
    ports:
      - "8002:8002"
    environment:
      STT_MODEL: ${STT_MODEL:-base}
      STT_LANGUAGE: ${STT_LANGUAGE:-}
      STT_DEVICE: ${STT_DEVICE:-cpu}
    volumes:
      - whisper_models:/models
    restart: unless-stopped

  wake:
    image: voice-chef-wake:latest
    build:
      context: ../wake/
    # /dev/snd + audio group give the container ALSA access. The reSpeaker
    # XVF3800 is shared with PipeWire on the host (multi-client capture is
    # supported by ALSA via dmix/dsnoop). If multiple capture devices are
    # present, set WAKE_DEVICE to a sounddevice index (`python -m sounddevice`).
    devices:
      - "/dev/snd:/dev/snd"
    group_add:
      - "audio"
    environment:
      WAKE_MODELS: ${WAKE_MODELS:-hey_jarvis}
      WAKE_THRESHOLD: ${WAKE_THRESHOLD:-0.5}
      WAKE_COOLDOWN_MS: ${WAKE_COOLDOWN_MS:-1500}
      WAKE_SAMPLE_RATE: ${WAKE_SAMPLE_RATE:-16000}
      WAKE_DEVICE: ${WAKE_DEVICE:-}
    restart: unless-stopped

volumes:
  whisper_models:
