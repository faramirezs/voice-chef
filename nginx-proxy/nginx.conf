resolver 127.0.0.11 valid=30s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ── Rate limiting by API key/IP ────────────────────────────────────────────
limit_req_zone $http_x_api_key:$remote_addr zone=api_key_limit:10m rate=100r/m;
limit_req_zone $remote_addr zone=public_api_limit:10m rate=30r/m;
limit_req_zone $http_x_api_key zone=api_key_only_limit:10m rate=100r/m;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 308 https://$host:4444$request_uri;
}

server {
    listen 4444 ssl;
    listen [::]:4444 ssl;
    server_name _;

    # ── SSL ────────────────────────────────────────────────────
    ssl_certificate     /etc/nginx/ssl/nginx.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ── Office frontend (root) ─────────────────────────────────
    location / {
        set $office_office http://office-frontend:80;
        proxy_pass $office_office;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Kitchen frontend ───────────────────────────────────────
    location /kitchen/ {
        set $kitchen_office http://kitchen-frontend:80;
        rewrite ^/kitchen/(.*) /$1 break;
        proxy_pass $kitchen_office;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # PUBLIC API (must come first)
    location /api/public/ {
        # Rate limiting for public API endpoints
        # GET /recipes (no key required) - relaxed limit
        if ($request_method = GET) {
            limit_req zone=public_api_limit burst=5 nodelay;
        }
        # POST/PATCH/DELETE (API key required) - stricter limit
        if ($request_method != GET) {
            limit_req zone=api_key_limit burst=2 nodelay;
            # Verify X-API-Key header is present for write operations
            if ($request_method != GET) {
                if ($http_x_api_key = "") {
                    return 401;
                }
            }
        }

        proxy_pass http://backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Pass through API key header
        proxy_set_header X-API-Key $http_x_api_key;
    }
    # ── Backend API ────────────────────────────────────────────
    location /api/ {
        set $backend_office http://backend:80;
        proxy_pass $backend_office$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Agent service (WebSocket + SSE) ───────────────────────
    location /agent/ {
        set $agent_office http://agent:8001;
        rewrite ^/agent/(.*) /$1 break;
        proxy_pass $agent_office;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── STT service ────────────────────────────────────────────
    location /stt/ {
        set $stt_office http://stt:8002;
        rewrite ^/stt/(.*) /$1 break;
        proxy_pass $stt_office;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Uploads (static files served by backend) ───────────────
    location /uploads/ {
        set $backend_office http://backend:80;
        proxy_pass $backend_office$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Swagger docs ───────────────────────────────────────────
    location /docs {
        set $backend_office http://backend:80;
        proxy_pass $backend_office$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        set $backend_office http://backend:80;
        proxy_pass $backend_office$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
