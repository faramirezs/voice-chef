[alembic]
script_location = db/alembic
prepend_sys_path = %(here)s
# db/alembic/env.py is set up to read from the DATABASE_URL environment variable.
# It prioritizes DATABASE_URL from your .env file and only falls back to the 
# hardcoded URL in alembic.ini if the env var isn't set.
sqlalchemy.url = 

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
