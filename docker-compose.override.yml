services:
  nginx-proxy:
    profiles: ["disabled"]  # Keeps it in compose but won't start

  office-frontend:
    build:
      target: dev
    volumes:
      - ./frontend/office:/app
      - office_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_KITCHEN_URL: http://localhost:5174
  kitchen-frontend:
    build:
      target: dev
    volumes:
      - ./frontend/kitchen:/app
      - kitchen_node_modules:/app/node_modules
    ports:
      - "5174:5174"
    environment:
      VITE_OFFICE_URL: http://localhost:5173
      VITE_AGENT_DEBUG_STREAM: "1"

  agent:
    environment:
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
      AGENT_DEBUG_STREAM: "1"
      AGENT_PROVIDER: ${AGENT_PROVIDER:-nvidia}
      AGENT_BASE_URL: ${AGENT_BASE_URL}
      AGENT_API_KEY: ${AGENT_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-ai/deepseek-v4-flash}
    volumes:
      - ./agent/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
  db:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8000:80"
    volumes:
      - ./backend/app:/code/app
      - backend_data:/code/data

  stt:
    volumes:
      - ./stt/app:/app/app

volumes:
  postgres_data:
  whisper_models:
  office_node_modules:
  kitchen_node_modules:

networks:
  app-network:
