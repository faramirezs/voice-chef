services:
  db:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8000:80"
    volumes:
      - ./backend/app:/code/app

  office-frontend:
    build:
      target: dev
    volumes:
      - ./frontend/office:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  kitchen-frontend:
    build:
      target: dev
    volumes:
      - ./frontend/kitchen:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    environment:
      VITE_AGENT_URL: http://localhost:8001
      VITE_AGENT_DEBUG_STREAM: "1"

  agent:
    environment:
      AGENT_DEBUG_STREAM: "1"
    volumes:
      - ./agent/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
volumes:
  node_modules:
