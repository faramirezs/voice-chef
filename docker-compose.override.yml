services:
  db:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8000:80"
    volumes:
      - ./backend/app:/code/app

  office-frontend:
    build:
      target: dev
    volumes:
      - ./frontend/office:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  kitchen-frontend:
    build:
      target: dev
    volumes:
      - ./frontend/kitchen:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    environment:
      VITE_AGENT_URL: http://localhost:8001
      VITE_AGENT_DEBUG_STREAM: "1"

  agent:
    environment:
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174"
      AGENT_DEBUG_STREAM: "1"
      AGENT_PROVIDER: ${AGENT_PROVIDER:-nvidia}
      AGENT_BASE_URL: ${AGENT_BASE_URL}
      AGENT_API_KEY: ${AGENT_API_KEY}
      AGENT_MODEL: ${AGENT_MODEL:-deepseek-ai/deepseek-v4-flash}
    volumes:
      - ./agent/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001", "--reload"]
volumes:
  node_modules:
