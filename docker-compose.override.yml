services:
  office-frontend:
    build:
      target: dev
    volumes:
      - ./frontend/office:/app
      - /app/node_modules
    ports:
      - "5173:5173"

  kitchen-frontend:
    build:
      target: dev
    volumes:
      - ./frontend/kitchen:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    environment:
      VITE_AGENT_URL: http://localhost:8001
      VITE_STT_URL: http://localhost:8002
      VITE_AGENT_DEBUG_STREAM: "1"

  agent:
    environment:
      AGENT_DEBUG_STREAM: "1"

  db:
    ports:
      - "5432:5432"

  backend:
    ports:
      - "8000:80"
    volumes:
      - ./backend/app:/code/app

  stt:
    volumes:
      - ./stt/app:/app/app

volumes:
  postgres_data:
  whisper_models:
  node_modules:

networks:
  app-network:
